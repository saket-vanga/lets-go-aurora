<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chasing Aurora poster</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Instrument+Sans:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=block">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  :root{--night:#060a16;--snow:#ecf2ff;--mist:#93a2c3;--aurora:#6ff5c4;--violet:#b69cff;--ice:#8fd3ff}
  *{box-sizing:border-box;margin:0}
  html,body{width:1080px;height:1920px;overflow:hidden;background:var(--night)}
  body{position:relative;color:var(--snow);font-family:"Instrument Sans",-apple-system,sans-serif}
  canvas{position:absolute;inset:0}
  .wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:120px 90px 100px;text-align:center}
  .eyebrow{font:700 30px "JetBrains Mono",monospace;letter-spacing:.28em;text-transform:uppercase;color:var(--aurora);text-shadow:0 0 30px rgba(111,245,196,.6)}
  h1{font:800 150px/.95 "Unbounded",sans-serif;letter-spacing:-.04em;margin-top:34px;text-shadow:0 10px 60px rgba(0,0,0,.6)}
  h1 span{display:block;text-shadow:none;background:linear-gradient(90deg,#8dffd6,#9fe2ff 55%,#cbb8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{font:600 38px/1.35 "Instrument Sans";color:var(--snow);opacity:.9;margin-top:34px}
  .sub b{color:var(--aurora)}
  .card{margin-top:auto;position:relative;padding:44px;border-radius:56px;background:#fff;box-shadow:0 0 140px rgba(111,245,196,.35),0 40px 80px rgba(0,0,0,.6)}
    #qr svg{display:block;width:560px;height:560px}
  .badge{position:absolute;left:50%;top:50%;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:32px;background:#fff;padding:12px}
  .badge img{width:100%;height:100%;border-radius:22px;display:block}
  .scan{margin-top:70px;font:800 58px "Unbounded";letter-spacing:-.02em}
  .how{margin-top:16px;margin-bottom:48px;font:600 32px/1.4 "Instrument Sans";color:var(--mist)}
  .how b{color:var(--snow)}
  .feats{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;width:100%;margin-top:auto}
  .f{display:flex;flex-direction:column;align-items:center;gap:16px;padding:30px 10px;border-radius:32px;background:rgba(16,24,48,.6);border:2px solid rgba(150,180,255,.16)}
  .f svg{width:58px;height:58px;fill:none;stroke:var(--aurora);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .f span{font:700 25px/1.2 "Instrument Sans"}
  .url{margin-top:26px;margin-bottom:auto;font:700 44px "Instrument Sans";color:var(--aurora);letter-spacing:.01em}
</style>
</head>
<body>
<canvas id="sky" width="1080" height="1920"></canvas>
<div class="wrap">
  <div class="eyebrow">Norway · Sweden · Finland</div>
  <h1>Chasing<span>Aurora</span></h1>
  <p class="sub"><b>25 Nov – 7 Dec</b></p>

  <div class="card"><div id="qr"></div><div class="badge"><img src="../docs/icon-180.png" alt=""></div></div>

  <div class="scan">Scan to open</div>
  <div class="url">chasingaurora.netlify.app</div>
</div>
<script>
const URL_='https://chasingaurora.netlify.app';
const q=qrcode(0,'H');q.addData(URL_);q.make();
const n=q.getModuleCount(),c=10,m=0,size=n*c;
let svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+size+' '+size+'" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/>';
const finder=(r,cc)=>(r<7&&cc<7)||(r<7&&cc>=n-7)||(r>=n-7&&cc<7);
for(let r=0;r<n;r++)for(let k=0;k<n;k++){if(!q.isDark(r,k)||finder(r,k))continue;svg+='<rect x="'+(k*c+.5)+'" y="'+(r*c+.5)+'" width="'+(c-1)+'" height="'+(c-1)+'" rx="2" fill="#0b1430"/>'}
[[0,0],[0,n-7],[n-7,0]].forEach(([r,k])=>{const x=k*c,y=r*c;svg+='<rect x="'+(x+5)+'" y="'+(y+5)+'" width="'+(7*c-10)+'" height="'+(7*c-10)+'" rx="16" fill="none" stroke="#0b1430" stroke-width="10"/><rect x="'+(x+20)+'" y="'+(y+20)+'" width="'+(3*c)+'" height="'+(3*c)+'" rx="8" fill="#14a37f"/>'});
document.getElementById('qr').innerHTML=svg+'</svg>';

// aurora sky
const cv=document.getElementById('sky'),cx=cv.getContext('2d'),W=1080,H=1920;
const bg=cx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#050914');bg.addColorStop(.55,'#08112a');bg.addColorStop(1,'#060a16');cx.fillStyle=bg;cx.fillRect(0,0,W,H);
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
for(let i=0;i<260;i++){cx.globalAlpha=.25+rnd()*.7;cx.fillStyle='#dfe8ff';cx.beginPath();cx.arc(rnd()*W,rnd()*H*.8,rnd()*1.8+.4,0,7);cx.fill()}
const sp=document.createElement('canvas');sp.width=2;sp.height=256;const g=sp.getContext('2d'),gr=g.createLinearGradient(0,0,0,256);
gr.addColorStop(0,'rgba(182,120,255,0)');gr.addColorStop(.35,'rgba(170,125,255,.34)');gr.addColorStop(.72,'rgba(90,255,190,.9)');gr.addColorStop(.86,'rgba(150,255,225,.7)');gr.addColorStop(1,'rgba(90,255,190,0)');g.fillStyle=gr;g.fillRect(0,0,2,256);
cx.globalCompositeOperation='lighter';
const bands=[{y:.30,a:.06,h:.26,k:2.2,ph:0,al:.55},{y:.36,a:.045,h:.18,k:3.4,ph:2.1,al:.4},{y:.24,a:.05,h:.2,k:1.3,ph:4.2,al:.32}];
const t=5200;
for(const b of bands)for(let x=-4;x<W+4;x+=4){const u=x/W;const y=H*(b.y+b.a*Math.sin(u*b.k*Math.PI+t*.0006+b.ph)+.012*Math.sin(x*.02+b.ph));const h=H*b.h*(.55+.45*Math.sin(x*.008+b.ph));const w=Math.sin(x*.005+b.ph*1.7);cx.globalAlpha=Math.min(1,b.al*(.25+.75*w*w));cx.drawImage(sp,x,y-h,5,h)}
cx.globalCompositeOperation='source-over';cx.globalAlpha=1;
// snowy ridge at the bottom
const rg=cx.createLinearGradient(0,H-260,0,H);rg.addColorStop(0,'rgba(20,30,60,.0)');rg.addColorStop(1,'rgba(20,30,60,.9)');cx.fillStyle=rg;
cx.beginPath();cx.moveTo(0,H);for(let x=0;x<=W;x+=20){cx.lineTo(x,H-150-60*Math.abs(((x/W*3.2)%2)-1)-20*Math.sin(x*.013))}cx.lineTo(W,H);cx.fill();
document.title='ready';
</script>
</body>
</html>
